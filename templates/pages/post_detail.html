<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{.Post.Title}}</title>
</head>
<body>

    <a href="/">← Back to Feed</a>

    <h1>{{.Post.Title}}</h1>

    {{if .IsOwner}}
        {{if .Post.IsPrivate}}
            <hr>
            <h2>Share this post</h2>

            <form action="/weblog/{{.Post.ID}}/access" method="POST">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <button type="submit">Share</button>
            </form>
        {{end}}
    {{end}}

    <hr>

    <div>
        <p>{{.Post.Content}}</p>
    </div>

    {{if .Post.IsPrivate}}
    <hr>

    <h2>Share this post</h2>

    <form
            action="/weblog/{{.Post.ID}}/access"
            method="POST"
        >
            <label for="username">
                Username:
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <button type="submit">
                Share
            </button>
        </form>
    {{end}}

</body>
</html>
