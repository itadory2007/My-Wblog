<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>

    <h1>Sign Up</h1>

    <form action="/signup" method="POST">
        <div>
            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</body>
</html>
