<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Post</title>
</head>
<body>

    <h1>Create Post</h1>

    <form action="/posts" method="POST">

        <div>
            <label for="title">Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                required
            >
        </div>

        <br>

        <div>
            <label for="content">Content:</label>
            <br>
            <textarea
                id="content"
                name="content"
                rows="10"
                cols="60"
                required
            ></textarea>
        </div>

        <br>

        <div>
            <label for="image">Image URL:</label>
            <input
                type="text"
                id="image"
                name="image"
            >
        </div>

        <br>

        <div>
            <label>
                <input
                    type="radio"
                    name="is_private"
                    value="false"
                    checked
                >
                Public
            </label>

            <label>
                <input
                    type="radio"
                    name="is_private"
                    value="true"
                >
                Private
            </label>
        </div>

        <br>

        <button type="submit">Create Post</button>

    </form>

    <br>

    <a href="/">Back to Feed</a>

</body>
</html>
